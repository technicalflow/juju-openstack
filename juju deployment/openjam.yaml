# OpenStack Caracal (2024.1) on Ubuntu 24.04 LTS (Noble)
name: openstack-base
default-base: ubuntu@24.04
series: noble

variables:
  openstack-origin: &openstack-origin distro
  data-port: &data-port br-ex:enp1s0
  osd-devices: &osd-devices /dev/vdb
  expected-osd-count: &expected-osd-count 3
  expected-mon-count: &expected-mon-count 3

machines:
  '0':
    base: ubuntu@24.04
    constraints: tags=vm
  '1':
    base: ubuntu@24.04
    constraints: tags=vm
  '2':
    base: ubuntu@24.04
    constraints: tags=vm

applications:
  ceph-mon:
    charm: ch:ceph-mon
    channel: squid/stable
    num_units: 3
    options:
      expected-osd-count: *expected-osd-count
      monitor-count: *expected-mon-count
      source: *openstack-origin
    bindings:
      "": public
    to:
    - lxd:0
    - lxd:1
    - lxd:2

  ceph-osd:
    charm: ch:ceph-osd
    channel: squid/stable
    num_units: 3
    options:
      osd-devices: *osd-devices
      source: *openstack-origin
    bindings:
      "": public
    to:
    - '0'
    - '1'
    - '2'

  ceph-radosgw:
    charm: ch:ceph-radosgw
    channel: squid/stable
    num_units: 1
    options:
      source: *openstack-origin
    bindings:
      "": public
    to:
    - lxd:2

  cinder-mysql-router:
    base: ubuntu@24.04
    charm: ch:mysql-router
    channel: 8.0/stable

  cinder:
    charm: ch:cinder
    channel: 2024.1/stable
    num_units: 1
    options:
      block-device: None
      glance-api-version: 2
      openstack-origin: *openstack-origin
    bindings:
      "": public
    to:
    - lxd:1

  cinder-ceph:
    base: ubuntu@24.04
    charm: ch:cinder-ceph
    channel: 2024.1/stable
    num_units: 0

  glance-mysql-router:
    base: ubuntu@24.04
    charm: ch:mysql-router
    channel: 8.0/stable
    bindings:
      "": public

  glance:
    charm: ch:glance
    channel: 2024.1/stable
    num_units: 1
    options:
      openstack-origin: *openstack-origin
    bindings:
      "": public
    to:
    - lxd:2

  glance-simplestreams-sync:
    charm: ch:glance-simplestreams-sync
    channel: 2024.1/stable
    num_units: 1
    options:
      run: true
    bindings:
      "": public
    to:
    - 'lxd:2'

  keystone-mysql-router:
    base: ubuntu@24.04
    charm: ch:mysql-router
    channel: 8.0/stable
    bindings:
      "": public

  keystone:
    charm: ch:keystone
    channel: 2024.1/stable
    num_units: 1
    options:
      openstack-origin: *openstack-origin
    bindings:
      "": public
    to:
    - lxd:0

  neutron-mysql-router:
    base: ubuntu@24.04
    charm: ch:mysql-router
    channel: 8.0/stable
    bindings:
      "": public

  neutron-api-plugin-ovn:
    base: ubuntu@24.04
    charm: ch:neutron-api-plugin-ovn
    channel: 2024.1/stable
    bindings:
      "": public

  neutron-api:
    charm: ch:neutron-api
    channel: 2024.1/stable
    num_units: 1
    options:
      enable-ml2-port-security: true
      neutron-security-groups: true
      flat-network-providers: physnet1
      openstack-origin: *openstack-origin
    bindings:
      "": public
    to:
    - lxd:1

  placement-mysql-router:
    base: ubuntu@24.04
    charm: ch:mysql-router
    channel: 8.0/stable
    bindings:
      "": public

  placement:
    charm: ch:placement
    channel: 2024.1/stable
    num_units: 1
    options:
      openstack-origin: *openstack-origin
    bindings:
      "": public
    to:
    - lxd:2

  nova-mysql-router:
    base: ubuntu@24.04
    charm: ch:mysql-router
    channel: 8.0/stable
    bindings:
      "": public

  nova-cloud-controller:
    charm: ch:nova-cloud-controller
    channel: 2024.1/stable
    num_units: 1
    options:
      console-access-protocol: spice
      network-manager: Neutron
      openstack-origin: *openstack-origin
    bindings:
      "": public
    to:
    - lxd:0

  nova-compute:
    charm: ch:nova-compute
    channel: 2024.1/stable
    num_units: 3
    options:
      customize-failure-domain: true
      libvirt-image-backend: rbd
      virt-type: kvm
      rbd-pool: cinder-ceph
      config-flags: default_ephemeral_format=ext4
      enable-live-migration: true
      enable-resize: true
      migration-auth-type: ssh
      openstack-origin: *openstack-origin
    bindings:
      "": public
    to:
    - '0'
    - '1'
    - '2'

  ntp:
    base: ubuntu@24.04
    charm: ch:ntp
    num_units: 0
    bindings:
      "": public

  dashboard-mysql-router:
    base: ubuntu@24.04
    charm: ch:mysql-router
    channel: 8.0/stable
    bindings:
      "": public

  openstack-dashboard:
    charm: ch:openstack-dashboard
    channel: 2024.1/stable
    num_units: 1
    options:
      openstack-origin: *openstack-origin
    bindings:
      "": public
    to:
    - lxd:2

  rabbitmq-server:
    charm: ch:rabbitmq-server
    channel: 3.12/stable
    num_units: 1
    bindings:
      "": public
    to:
    - lxd:0

  mysql-innodb-cluster:
    charm: ch:mysql-innodb-cluster
    channel: 8.0/stable
    num_units: 3
    bindings:
      "": public
    to:
    - lxd:0
    - lxd:1
    - lxd:2

  ovn-central:
    charm: ch:ovn-central
    channel: 24.03/stable
    num_units: 3
    options:
      source: *openstack-origin
    bindings:
      "": public
    to:
    - lxd:0
    - lxd:1
    - lxd:2

  ovn-chassis:
    base: ubuntu@24.04
    charm: ch:ovn-chassis
    channel: 24.03/stable
    options:
      ovn-bridge-mappings: physnet1:br-ex
      bridge-interface-mappings: *data-port
    bindings:
      "": public

  vault-mysql-router:
    base: ubuntu@24.04
    charm: ch:mysql-router
    channel: 8.0/stable
    bindings:
      "": public

  vault:
    charm: ch:vault
    channel: 1.8/stable
    num_units: 1
    bindings:
      "": public
    to:
    - lxd:1

relations:
- - nova-compute:amqp
  - rabbitmq-server:amqp
- - nova-cloud-controller:identity-service
  - keystone:identity-service
- - glance:identity-service
  - keystone:identity-service
- - neutron-api:identity-service
  - keystone:identity-service
- - neutron-api:amqp
  - rabbitmq-server:amqp
- - glance:amqp
  - rabbitmq-server:amqp
- - nova-cloud-controller:image-service
  - glance:image-service
- - nova-compute:image-service
  - glance:image-service
- - nova-cloud-controller:cloud-compute
  - nova-compute:cloud-compute
- - nova-cloud-controller:amqp
  - rabbitmq-server:amqp
- - openstack-dashboard:identity-service
  - keystone:identity-service
- - nova-cloud-controller:neutron-api
  - neutron-api:neutron-api
- - cinder:image-service
  - glance:image-service
- - cinder:amqp
  - rabbitmq-server:amqp
- - cinder:identity-service
  - keystone:identity-service
- - cinder:cinder-volume-service
  - nova-cloud-controller:cinder-volume-service
- - cinder-ceph:storage-backend
  - cinder:storage-backend
- - ceph-mon:client
  - nova-compute:ceph
- - nova-compute:ceph-access
  - cinder-ceph:ceph-access
- - ceph-mon:client
  - cinder-ceph:ceph
- - ceph-mon:client
  - glance:ceph
- - ceph-osd:mon
  - ceph-mon:osd
- - ntp:juju-info
  - nova-compute:juju-info
- - ceph-radosgw:mon
  - ceph-mon:radosgw
- - ceph-radosgw:identity-service
  - keystone:identity-service
- - placement:identity-service
  - keystone:identity-service
- - placement:placement
  - nova-cloud-controller:placement
- - keystone:shared-db
  - keystone-mysql-router:shared-db
- - cinder:shared-db
  - cinder-mysql-router:shared-db
- - glance:shared-db
  - glance-mysql-router:shared-db
- - nova-cloud-controller:shared-db
  - nova-mysql-router:shared-db
- - neutron-api:shared-db
  - neutron-mysql-router:shared-db
- - openstack-dashboard:shared-db
  - dashboard-mysql-router:shared-db
- - placement:shared-db
  - placement-mysql-router:shared-db
- - vault:shared-db
